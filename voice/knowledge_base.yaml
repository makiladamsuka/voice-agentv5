    - BSc programs
  reply: >
    The Faculty of IT offers a four-year BSc Honours program in Information
    Technology, covering areas like software engineering, data science, AI,
    and networking.

- topic: postgraduate_programs
  aliases:
    - postgraduate programs
    - masters programs
    - MSc
    - PhD programs
    - postgrad
    - higher studies
  reply: >
    FIT offers MSc programs in IT Management, Data Science, and Cybersecurity,
    as well as PhD research opportunities in various computing disciplines.

- topic: admission
