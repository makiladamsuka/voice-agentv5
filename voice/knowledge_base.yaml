- topic: history
  aliases:
    - history of UOM
    - when was the university founded
    - how old is this university
    - when was FIT established
    - founding of UOM
  reply: >
    The University of Moratuwa was established in 1972 as a full university,
    building on the College of Technology founded in 1966. The Faculty of
    Information Technology was established in 2001.

- topic: research
  aliases:
    - research at UOM
    - research projects
    - research centers
    - what research is done here
    - academic research
  reply: >
    UOM is a research-active university with multiple research centres covering
    AI, robotics, sustainable engineering, and more. FIT has dedicated labs for
    machine learning, cybersecurity, and IoT research.
