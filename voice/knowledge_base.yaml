  reply: >
    Admission to UOM is based on Sri Lankan A/L results and the Z-score system,
    managed by the University Grants Commission. Specific cutoffs vary by year
    and program.

- topic: location
  aliases:
    - where is the university
    - university address
    - how to get here
    - location of UOM
    - where is UOM located
  reply: >
    The University of Moratuwa is located in Katubedda, Moratuwa, about 16
    kilometres south of Colombo. You can reach it by train or bus along the
    southern coastal line.

