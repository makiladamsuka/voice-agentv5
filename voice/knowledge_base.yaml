  reply: >
    The Faculty of Information Technology, or FIT, is one of Sri Lanka's
    leading IT faculties. It offers undergraduate and postgraduate programs
    in Computer Science, IT, and Data Science.

- topic: university_overview
  aliases:
    - university of moratuwa
    - UOM
    - about the university
    - this university
    - what is UOM
    - tell me about the university
    - where are we
    - what place is this
  reply: >
    We are at the University of Moratuwa, one of Sri Lanka's top technological
    universities, founded in 1972 and located in Katubedda, Moratuwa. It
    specialises in Engineering, Architecture, and Information Technology.

- topic: undergraduate_programs
  aliases:
    - undergraduate programs
    - bachelor programs
    - degree programs
